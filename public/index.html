<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostDestiny — 24/7 VPS Sales & Support Agent</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-2: #1a233d;
      --border: #283558;
      --text: #e6ecff;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #1d4ed8;
      --code-bg: #090d1a;
      --badge-bg: #1e293b;
      --green: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .brand span {
      display: block;
      font-size: 12px;
      color: var(--muted);
    }
    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary:hover { border-color: var(--accent); }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .chip:hover { border-color: var(--accent); }
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 14.5px;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble p { margin: 0 0 8px 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 6px 0 8px 20px; padding: 0; }
    .bubble li { margin-bottom: 4px; }
    .bubble code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code {
      background: transparent;
      padding: 0;
    }
    .tools-meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .tools-meta summary {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      user-select: none;
    }
    .tools-list {
      margin-top: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      white-space: pre-wrap;
    }
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }
    form {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14.5px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="dot" title="Connected"></div>
      <div>
        <h1>HostDestiny AI Assistant</h1>
        <span>24/7 White-Label VPS Sales &amp; Support</span>
      </div>
    </div>
    <button class="btn-secondary" id="newChatBtn" type="button">New Chat</button>
  </header>

  <main id="chatLog">
    <div class="chips" id="sampleChips">
      <button class="chip" type="button">What is your cheapest Windows VPS in Germany?</button>
      <button class="chip" type="button">Show me 8GB VPS plans in Pakistan</button>
      <button class="chip" type="button">My VPS time zone keeps resetting</button>
      <button class="chip" type="button">What uptime SLA and network speed do you guarantee?</button>
      <button class="chip" type="button">Who is your upstream vendor? Is it Rabisu or Hyonix?</button>
    </div>
  </main>

  <footer>
    <form id="chatForm">
      <input
        id="msgInput"
        type="text"
        placeholder="Ask about VPS plans, pricing, locations, or server troubleshooting..."
        autocomplete="off"
        required
      />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </footer>

  <script>
    const chatLog = document.getElementById("chatLog");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const sampleChips = document.getElementById("sampleChips");

    let sessionId = localStorage.getItem("hd_session_id") || ("sess_" + Math.random().toString(36).slice(2, 10));
    localStorage.setItem("hd_session_id", sessionId);

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdown(md) {
      const codeBlocks = [];
      let html = md.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, _lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(`<pre><code>${escapeHtml(code.trimEnd())}</code></pre>`);
        return `@@CODEBLOCK_${idx}@@`;
      });

      html = escapeHtml(html);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/^[-*]\s+(.+)$/gm, "<li>$1</li>");
      html = html.replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>").replace(/<\/ul>\s*<ul>/g, "");

      const paragraphs = html.split(/\n{2,}/).map((p) => {
        const t = p.trim();
        if (!t) return "";
        if (t.startsWith("<ul>") || t.startsWith("@@CODEBLOCK_")) return t;
        return `<p>${t.replace(/\n/g, "<br>")}</p>`;
      });

      let out = paragraphs.join("");
      codeBlocks.forEach((block, idx) => {
        out = out.replace(`@@CODEBLOCK_${idx}@@`, block);
      });
      return out;
    }

    function appendMessage(role, text, meta) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = role === "user" ? `<p>${escapeHtml(text)}</p>` : renderMarkdown(text);
      wrapper.appendChild(bubble);

      if (role === "bot" && meta) {
        const details = document.createElement("details");
        details.className = "tools-meta";
        const toolNames = meta.toolsUsed?.length
          ? meta.toolsUsed.map((t) => t.name).join(", ")
          : "none (direct reply)";
        details.innerHTML = `<summary>Tools used: ${escapeHtml(toolNames)} • ${escapeHtml(meta.modelUsed || "")}</summary>`;
        if (meta.toolsUsed?.length) {
          const pre = document.createElement("div");
          pre.className = "tools-list";
          pre.textContent = meta.toolsUsed
            .map((t) => `${t.name}(${JSON.stringify(t.args)}) -> ${t.summary}`)
            .join("\n");
          details.appendChild(pre);
        }
        wrapper.appendChild(details);
      }

      chatLog.appendChild(wrapper);
      chatLog.scrollTop = chatLog.scrollHeight;
      return wrapper;
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      appendMessage("user", text);
      msgInput.value = "";
      msgInput.disabled = true;
      sendBtn.disabled = true;

      const thinkingEl = appendMessage("bot", "Thinking...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: text }),
        });
        const data = await res.json();
        thinkingEl.remove();
        if (!res.ok) {
          appendMessage("bot", `Error: ${data.error || "Request failed"}`);
        } else {
          appendMessage("bot", data.reply, data);
        }
      } catch (err) {
        thinkingEl.remove();
        appendMessage("bot", `Network error: ${err.message}`);
      } finally {
        msgInput.disabled = false;
        sendBtn.disabled = false;
        msgInput.focus();
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(msgInput.value);
    });

    sampleChips.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (btn) sendMessage(btn.textContent);
    });

    newChatBtn.addEventListener("click", async () => {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId }),
      }).catch(() => {});
      sessionId = "sess_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("hd_session_id", sessionId);
      chatLog.querySelectorAll(".msg").forEach((m) => m.remove());
      appendMessage("bot", "Hi! I'm the HostDestiny VPS Assistant. Ask me about our plans, pricing, locations, or server troubleshooting.");
    });

    appendMessage("bot", "Hi! I'm the HostDestiny VPS Assistant. Ask me about our plans, pricing, locations, or server troubleshooting.");
  </script>
</body>
</html>
